workflows:
  ios-unsigned-ipa:
    name: Build iOS Unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_PROJECT: "Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"
        OUTPUT_IPA_NAME: "NRO_AllStars_unsigned.ipa"
      xcode: 16.0
      cocoapods: default

    scripts:
      - name: Pull Git LFS files
        script: |
          echo "=== Pulling Git LFS files ==="
          git lfs install
          git lfs pull || true

      - name: Disable Code Signing in Project
        script: |
          echo "=== Disabling code signing in $XCODE_PROJECT ==="
          sed -i '' \
            -e 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' \
            -e 's/CODE_SIGN_IDENTITY\[sdk=iphoneos\*\] = "iPhone Developer";/CODE_SIGN_IDENTITY[sdk=iphoneos*] = "";/g' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/PROVISIONING_PROFILE = [^;]*;/PROVISIONING_PROFILE = "";/g' \
            -e 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' \
            "$XCODE_PROJECT/project.pbxproj"

      - name: Build GameAssembly (IL2CPP)
        script: |
          echo "=== 0. Grant executable permissions to IL2CPP tools ==="
          chmod -R +x Il2CppOutputProject/IL2CPP/build/ || true
          chmod +x process_symbols.sh || true
          chmod +x process_symbols_il2cpp.sh || true

          echo "=== 1. Building GameAssembly (IL2CPP static library) ==="
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -target "GameAssembly" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO

          echo "=== 2. Ensuring libraries exist in Products directory ==="
          PRODUCTS_DIR="build/Build/Products/Release-iphoneos"
          mkdir -p "$PRODUCTS_DIR"
          if [ -f "$PRODUCTS_DIR/libGameAssembly.a" ]; then
            echo "Found libGameAssembly.a, copying to il2cpp.a..."
            cp -f "$PRODUCTS_DIR/libGameAssembly.a" "$PRODUCTS_DIR/il2cpp.a"
          fi
          ls -la "$PRODUCTS_DIR" || true

      - name: Build unsigned .app
        script: |
          echo "=== 3. Building full App (Unity-iPhone) ==="
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package unsigned IPA
        script: |
          echo "=== 4. Packaging .app into .ipa ==="
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app file found in build directory!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -y "$OUTPUT_IPA_NAME" Payload
          rm -rf Payload
          echo "Successfully created $OUTPUT_IPA_NAME"

    artifacts:
      - "*.ipa"
